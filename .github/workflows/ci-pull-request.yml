name: Analyze Pull Request

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, coax]
    timeout-minutes: 30
    env:
      HUSKY: 0 # git hooks are not needed in CI
    steps:
      - name: 'Checkout repository on branch: ${{ github.ref_name }}'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Run Lint
        run: npm run lint:ci
      - name: Run Type Check
        run: npm run ts:check
      - name: Run Tests
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.scm.provider=git
            -Dsonar.sources=src/
            -Dsonar.eslint.reportPaths=eslint-report.json
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=public/**,src/__tests__/**,src/__mocks__/**,src/components/icons/**,vite.config.ts,eslint.config.js
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
